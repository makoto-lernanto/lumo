# Reguloj de `cargo-deny` por Lumo (Q04).
#
# La listo `allow` estas kompleta: ĉiu permesilo ne listigita — interalie GPL,
# AGPL kaj LGPL — estas rifuzata. Lumo nun havas neniun eksteran dependaĵon,
# do «ne renkontita» permesilo ne estas eraro.

[graph]
exclude-dev = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
include-dev = false
include-build = true
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
